name: package-smoke

# 目标：在一台从未装过 Qt 的 Windows 上，证明核心（无头 CLI）能自己起服务。
# GUI 那半边由 windeployqt + check-deps 静态保证：CI 没有桌面会话，WebEngine 起不来。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  no-qt-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 不用 install-qt-action：它默认拉最新 Python（含预览版），aqtinstall 在其上直接挂掉。
      # 版本与架构号不写死：本机那个版本是官方在线安装器装的，镜像里的清单未必同名，
      # 猜错了就是一句 exit 1 什么原因都看不到——所以先探测、再把选中的结果打印出来。
      - name: 安装 Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall

          $versions = (aqt list-qt windows desktop) -split '[\s,]+' |
              Where-Object { $_ -match '^\d+\.\d+\.\d+$' }
          if (-not $versions) {
              throw "aqt list-qt 没返回任何版本，可能是镜像不可达或 aqt 调用失败；上面应有详细报错"
          }
          $qtVersion = if ($versions -contains '6.10.3') { '6.10.3' } else { $versions | Select-Object -Last 1 }

          $arches = (aqt list-qt windows desktop --arch $qtVersion) -split '[\s,]+'
          $qtArch = if ($arches -contains 'win64_msvc2022_64') {
              'win64_msvc2022_64'
          } else {
              $arches | Where-Object { $_ -like 'win64_msvc*' } | Select-Object -Last 1
          }
          if (-not $qtArch) {
              throw "Qt $qtVersion 下找不到 win64_msvc* 架构，候选：$($arches -join ' ')"
          }
          Write-Host "选中 Qt：$qtVersion / $qtArch（可用版本尾部：$(($versions | Select-Object -Last 5) -join ' ')）"

          # Qt6 的 WebSockets 不在 qtbase 仓库里，属于独立的 qtwebsockets 模块，
          # 必须显式带 -m：上一版我把它当“多余的可选模块”删了，于是 configure 卡在找不到 Qt6WebSockets
          aqt install-qt windows desktop $qtVersion $qtArch -m qtwebsockets --outputdir "$env:GITHUB_WORKSPACE\Qt"
          "QT_VERSION=$qtVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # aqt 的目录名不等于 arch 参数：传 win64_msvc2022_64，落地目录叫 msvc2022_64。
          # 所以不拼路径也不猜命名：直接在版本目录里找带 windeployqt 的那个单子目录。
          $candidates = Get-ChildItem "$env:GITHUB_WORKSPACE\Qt\$qtVersion" -Directory -ErrorAction SilentlyContinue
          $qtDir = $candidates | Where-Object {
              Test-Path (Join-Path $_.FullName "bin\windeployqt.exe")
          } | Select-Object -First 1
          if (-not $qtDir) {
              $candidates | Select-Object -Expand FullName
              throw "装完找不到 bin\windeployqt.exe；上面是 $qtVersion 下的实际目录"
          }
          "QT_DIR=$($qtDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Qt 就位：$($qtDir.FullName)"

      # 失败时把诊断写进 step summary：Annotations 只给退出码，没这一步就只能来回猜
      - name: 安装失败时输出诊断
        if: failure()
        shell: pwsh
        run: |
          "## Qt 安装诊断" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          pip show aqtinstall | Select-String "Version" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          aqt list-qt windows desktop |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Test-Path "$env:GITHUB_WORKSPACE\Qt") {
              Get-ChildItem "$env:GITHUB_WORKSPACE\Qt" -Recurse -Depth 2 -Directory |
                  Select-Object -Expand FullName |
                  Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: 前端构建
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 配置并构建无头 CLI（Release）
        shell: pwsh
        run: |
          # 不用 "Visual Studio 17 2022" generator：它靠自己的发现逻辑找 VS，
          # 在 runner 上会报“could not find any instance of Visual Studio”。
          # 改用 vswhere（它才是官方定位器）拿到安装路径，进 Dev Shell 后走 Ninja：
          # 只要求 cl.exe 在 PATH，不再依赖 CMake 的 VS 探测。
          cmake --version | Select-Object -First 1
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "runner 上没有 vswhere：意味着没装任何 VS" }

          # 不要按组件 ID 过滤：runner 镜像升到了 VS 18，Microsoft.VisualCpp.Tools.HostX64
          # 在它上头查不到，就会误判“没 C++ 工具链”。直接遍历实例，用有没有 cl.exe 说事。
          $instances = & $vswhere -products * -prerelease -property installationPath
          if (-not $instances) { throw "vswhere 没报出任何 VS 实例" }
          $vsPath = $null
          foreach ($candidate in $instances) {
              $cl = Get-Item (Join-Path $candidate "VC\Tools\MSVC\*\bin\HostX64\x64\cl.exe") -ErrorAction SilentlyContinue
              if ($cl) { $vsPath = $candidate; break }
          }
          if (-not $vsPath) {
              ($instances -join "`n")
              throw "上面列出的 VS 实例里没有一个带 cl.exe：镜像缺 C++ 工具链"
          }
          Write-Host "VS: $vsPath"
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64" | Out-Null
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw "Dev Shell 后仍没有 cl.exe" }
          # 打印工具链版本：runner 是 VS 18，编译链接 Qt 的 msvc2022 预编译库时
          # 真出问题靠这一行就能看出是哪个 toolset，不用再来一轮
          cl 2>&1 | Select-Object -First 1
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { throw "runner 上没有 ninja，Ninja generator 用不了（应改回 VS generator 或装 ninja）" }

          cmake -S . -B build -G "Ninja Multi-Config" -DCMAKE_PREFIX_PATH="$env:QT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure 失败：真正的原因在上面，不是最后那句 ninja" }
          cmake --build build --config Release --target synthforge_cli
          if ($LASTEXITCODE -ne 0) { throw "编译/链接失败。" }

      # 部署到独立目录后静态扫描：依赖要么在包内，要么是系统自带
      - name: 部署依赖并静态自检
        run: |
          New-Item -ItemType Directory -Path dist_ci | Out-Null
          Copy-Item build/Release/synthforge_cli.exe dist_ci/
          & "$env:QT_DIR\bin\windeployqt.exe" --release --no-translations dist_ci/synthforge_cli.exe
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-deps.ps1 -Stage dist_ci -Exe synthforge_cli.exe

      # 把 PATH 缩到只有系统目录：这一刻起本机“没有 Qt”，能不能跑全看包自己
      - name: 无 Qt 环境冒烟：清 PATH 起服务并等 READY
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $exe = Join-Path $PWD "dist_ci/synthforge_cli.exe"
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--headless", "--data-dir", (Join-Path $PWD "ci-data") `
            -RedirectStandardError "cli-stderr.log" -NoNewWindow -PassThru
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path cli-stderr.log) -and (Select-String -Path cli-stderr.log -Pattern "READY ws=" -Quiet)) {
              $ready = $true
              break
            }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ready) {
            if (Test-Path cli-stderr.log) { Get-Content cli-stderr.log }
            throw "60 秒内没等到 READY：无 Qt 环境下核心起不来"
          }
          Get-Content cli-stderr.log | Select-Object -First 5
