name: package-smoke

# 目标：在一台从未装过 Qt 的 Windows 上，证明核心（无头 CLI）能自己起服务。
# GUI 那半边由 windeployqt + check-deps 静态保证：CI 没有桌面会话，WebEngine 起不来。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  no-qt-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 不用 install-qt-action：它默认拉最新 Python（含预览版），aqtinstall 在其上直接挂掉。
      # 自己调 aqt 反而可控：版本、镜像、安装路径全部写在本子上。
      # core 只用到 qtbase（Core/Gui/Widgets/Network/WebSockets/Sql 都在里面），无需 additional modules
      - name: 安装 Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall
          aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 --outputdir "$env:GITHUB_WORKSPACE\Qt"
          # aqt 用 arch 号做目录名（win64_msvc2022_64），与官方在线安装器的 msvc2022_64 不一样，别写错
          "QT_DIR=$env:GITHUB_WORKSPACE\Qt\6.10.3\win64_msvc2022_64" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\Qt\6.10.3\win64_msvc2022_64\bin\windeployqt.exe")) {
            Get-ChildItem "$env:GITHUB_WORKSPACE\Qt" -Recurse -Depth 2 -Directory | Select-Object -Expand FullName
            throw "Qt 安装后找不到 windeployqt，检查上面列出的实际目录结构"
          }

      - name: 前端构建
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 配置并构建无头 CLI（Release）
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_DIR"
          cmake --build build --config Release --target synthforge_cli

      # 部署到独立目录后静态扫描：依赖要么在包内，要么是系统自带
      - name: 部署依赖并静态自检
        run: |
          New-Item -ItemType Directory -Path dist_ci | Out-Null
          Copy-Item build/Release/synthforge_cli.exe dist_ci/
          & "$env:QT_DIR\bin\windeployqt.exe" --release --no-translations dist_ci/synthforge_cli.exe
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-deps.ps1 -Stage dist_ci -Exe synthforge_cli.exe

      # 把 PATH 缩到只有系统目录：这一刻起本机“没有 Qt”，能不能跑全看包自己
      - name: 无 Qt 环境冒烟：清 PATH 起服务并等 READY
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $exe = Join-Path $PWD "dist_ci/synthforge_cli.exe"
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--headless", "--data-dir", (Join-Path $PWD "ci-data") `
            -RedirectStandardError "cli-stderr.log" -NoNewWindow -PassThru
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path cli-stderr.log) -and (Select-String -Path cli-stderr.log -Pattern "READY ws=" -Quiet)) {
              $ready = $true
              break
            }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ready) {
            if (Test-Path cli-stderr.log) { Get-Content cli-stderr.log }
            throw "60 秒内没等到 READY：无 Qt 环境下核心起不来"
          }
          Get-Content cli-stderr.log | Select-Object -First 5
